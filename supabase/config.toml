# ================================================================
# VHM POS — Supabase Local Development Configuration
#
# Usage:
#   supabase start         → starts local Supabase stack
#   supabase db reset      → resets DB and applies migrations + seed
#   supabase migration new <name>  → creates a new migration file
#   supabase link --project-ref <ref>  → links to your remote project
#   supabase db push       → pushes local migrations to remote
#
# Replace 'replace-with-your-project-ref' before linking.
# ================================================================

project_id = "replace-with-your-project-ref"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled = true
# Point to your frontend dev server
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# VHM: Staff accounts are ONLY created by admins via Edge Functions.
# Direct public sign-up is disabled.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
