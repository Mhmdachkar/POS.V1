name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: RPC signatures vs migrations
        run: node scripts/check-rpc-signatures.mjs

      - name: Schema migration filenames (and remote drift when secrets exist)
        run: node scripts/check-schema-drift.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: French locale parity
        run: npx vitest run src/__tests__/i18n/frenchParity.test.ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
